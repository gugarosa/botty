[project]
name = "botty-bot"
version = "0.2.0"
description = "Botty Telegram bot service."
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.6",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bot", "settings"]

[tool.setuptools.packages.find]
include = ["handlers*", "tasks*", "utils*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
