[project]
name = "botty-api"
version = "0.2.0"
description = "Botty API service: speech-to-text and LLM chat backed by Azure."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "azure-cognitiveservices-speech>=1.40",
    "openai>=1.54",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["api", "settings"]

[tool.setuptools.packages.find]
include = ["handlers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
